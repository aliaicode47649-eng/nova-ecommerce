<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ایجاد حساب کاربری جدید | نُوا — NOVA</title>
  <meta name="description" content="عضویت در خانواده مشتریان استودیو نُوا و دریافت ۱۰٪ تخفیف خرید اول با کد NOVA10.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Header -->
  <!-- Top Announcement Promo Strip -->
  <div class="top-announcement-strip footer-promo-strip">
    <div class="top-promo-content">
      <span>✨ خرید آخر تابستون نُوا با تخفیف‌های جذاب تا ۷۰٪ | ارسال اکسپرس رایگان برای خریدهای بالای ۳,۰۰۰,۰۰۰ تومان</span>
    </div>
  </div>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-logo">NOVA <span class="logo-dot"></span></a>
      <div class="flex items-center gap-md">
        <button class="action-btn theme-toggle-btn" onclick="toggleTheme()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Register Card Stage -->
  <main class="container section-py" style="flex: 1; display: flex; align-items: center; justify-content: center;">
    <div class="reveal-scale-in" style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-xs); padding: clamp(2rem, 4vw, 3rem); max-width: 480px; width: 100%; box-shadow: var(--shadow-md);">
      <div style="text-align: center; margin-bottom: 2rem;">
        <span class="section-tag">خوش آمدید</span>
        <h1 style="font-size: var(--text-2xl); font-weight: bold; margin-top: 0.25rem;">عضویت در نُوا</h1>
        <p style="font-size: var(--text-xs); color: var(--text-secondary); margin-top: 0.4rem;">با عضویت، از ۱۰٪ تخفیف خرید اول و دسترسی به فروش‌های اختصاصی بهره‌مند شوید.</p>
      </div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="reg-name">نام و نام خانوادگی *</label>
          <input type="text" id="reg-name" class="form-input" placeholder="مثال: پارسا راد" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-phone">شماره تلفن همراه *</label>
          <input type="tel" id="reg-phone" class="form-input" placeholder="۰۹۱۲۳۴۵۶۷۸۹" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-pass">تعیین رمز عبور (حداقل ۶ کاراکتر) *</label>
          <input type="password" id="reg-pass" class="form-input" placeholder="••••••••" required>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label class="flex items-start gap-xs" style="cursor: pointer; font-size: var(--text-xs); color: var(--text-secondary); line-height: 1.6;">
            <input type="checkbox" id="reg-terms" checked style="accent-color: var(--accent); margin-top: 3px;">
            <span>کلیه <a href="terms.html" style="color: var(--accent); text-decoration: underline;">شرایط و قوانین</a> و سیاست‌های حفظ حریم خصوصی استودیو نُوا را مطالعه کرده و می‌پذیرم.</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          تکمیل عضویت و ورود
        </button>
      </form>

      <div style="text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); font-size: var(--text-xs); color: var(--text-secondary);">
        قبلاً ثبت‌نام کرده‌اید؟ <a href="login.html" style="color: var(--accent); font-weight: bold;">وارد شوید ←</a>
      </div>
    </div>
  </main>

  <footer class="site-footer" style="padding-top: 2rem; padding-bottom: 2rem;">
    <div class="container text-center" style="text-align: center; font-size: var(--text-xs); color: var(--text-tertiary);">
      © ۲۰۲۶ استودیو نُوا (NOVA). کلیه حقوق محفوظ است.
    </div>
  </footer>

  <div id="toast-container"></div>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/search.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/promo.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
